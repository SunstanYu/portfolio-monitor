# 示例配置（虚构账户）。
# 真实配置复制到 local/config.toml 再修改；local/ 不进 git。

base_currency = "USD"

[paths]
data_dir = "data"

[fx]
provider = "frankfurter"   # frankfurter（欧洲央行参考汇率）| static（固定汇率，测试用）

# 账户：source 对应 sources/registry.py 里注册的数据源
[[accounts]]
id = "demo-us"
name = "示例美股账户"
kind = "broker"            # broker | bank | crypto | other
source = "fake"
currency = "USD"
include_in_returns = true  # 是否计入收益率（银行账户一般为 false）

[[accounts]]
id = "demo-hk"
name = "示例港股账户"
kind = "broker"
source = "fake"
currency = "HKD"

[[accounts]]
id = "demo-bank"
name = "示例银行账户"
kind = "bank"
source = "manual"
currency = "HKD"
include_in_returns = false

# IBKR（Flex Web Service）：token 和 Query ID 放在 .env（IBKR_FLEX_TOKEN、IBKR_FLEX_QUERY_ID）
# [[accounts]]
# id = "ibkr"
# name = "IBKR"
# kind = "broker"
# source = "ibkr"
# currency = "USD"             # 账户基础货币
#
# [sources.ibkr]
# accounts = { "U1234567" = "ibkr" }   # Flex 账户号 → 上面的账户 id；只有一个 IBKR 账户时可省略
# flow_lookback_days = 7               # 每日同步回看几天的资金进出
# max_lag_days = 4                     # 当天没有报表时最多往前退几天

# OKX（API v5 只读 key，只读主账户）：key、secret、passphrase 放在 .env
# [[accounts]]
# id = "okx"
# name = "OKX"
# kind = "crypto"
# source = "okx"
# currency = "USD"
#
# [sources.okx]
# host = "www.okx.com"          # 美国站 us.okx.com，欧洲站 eea.okx.com（按 key 所在的站点）
# flow_lookback_days = 30       # 每次同步回看几天的充提记录
# reconcile_tolerance = 0.01    # 与 OKX 资产估值对账允许的偏差

# 风险规则：比例写小数（0.20 即 20%）；没写的用默认值，enabled = false 关闭
# [rules.instrument_concentration]   # 单一标的占投资资产（现金、稳定币不算）
# warn = 0.20
# critical = 0.35
# exempt = ["US:VOO"]                # 不检查的标的
# [rules.account_concentration]      # 单一账户占总资产
# warn = 0.60
# critical = 0.80
# [rules.allocation_drift]           # 偏离目标配置（百分点）
# warn = 0.05
# [rules.idle_cash]                  # 现金（含稳定币）占总资产
# warn = 0.30
# [rules.leverage]                   # 合约名义价值 + 融资，占投资资产（可超过 1）
# warn = 0.50
# critical = 1.00
# [rules.drawdown]                   # 从高点回撤
# warn = 0.20
# critical = 0.30
# [rules.daily_drop]                 # 单日跌幅
# warn = 0.05
# [rules.source_failures]            # 数据源连续失败天数
# warn = 2
# critical = 5
# [rules.data_jump]                  # 单日变化过大，疑似数据错误
# warn = 0.15
#
# [targets]                          # 目标配置，加起来为 1；不写就不检查偏离
# equity = 0.60
# crypto = 0.20
# cash = 0.20

[sources.fake]
start = "2025-01-01"
monthly_deposit = 2000
# fail_on = ["2025-03-03"]  # 模拟某天数据源故障
