# 每次推送到 main、每个 PR：安装依赖 → 跑测试 → 用虚构数据跑一遍完整流程
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # action 固定到提交 SHA（注释为对应版本）；setup-uv 只发布完整版本号标签，没有 v10 这类大版本标签
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - name: 安装依赖（Python 版本取自 .python-version，锁文件必须是最新的）
        run: uv sync --locked
      - name: 测试
        run: uv run pytest -q
      - name: 冒烟：虚构数据跑完整流程
        run: uv run portfolio-monitor demo --days 30
